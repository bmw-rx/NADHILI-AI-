<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1815" />
      <stop offset="50%" stop-color="#141413" />
      <stop offset="100%" stop-color="#0a0a09" />
    </linearGradient>

    <!-- Glowing Brand Primary Gradient -->
    <linearGradient id="nadhiliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="45%" stop-color="#da7756" />
      <stop offset="100%" stop-color="#f5a623" />
    </linearGradient>

    <!-- Accent Secondary Gradient -->
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="50%" stop-color="#eb947a" />
      <stop offset="100%" stop-color="#d45b34" />
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da7756" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#da7756" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#da7756" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#da7756" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="50" cy="50" r="42" fill="url(#centerGlow)" />

  <!-- Base Rounded Squircle Container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="8" y="8" width="84" height="84" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Stylized Neural "N" Emblem with Intersecting AI Spark -->
  <g filter="url(#glow)">
    <!-- Left Pillar of N -->
    <path
      d="M26 71 V30 C26 27.2 28.2 25 31 25 C33.8 25 36 27.2 36 30 V71 C36 73.8 33.8 76 31 76 C28.2 76 26 73.8 26 71 Z"
      fill="url(#nadhiliGrad)"
    />

    <!-- Diagonal Dynamic Ribbon of N -->
    <path
      d="M32 27 L68 67 C70 69.2 70 72 67.5 73.5 C65 75 62 74 60 71.8 L24 31.8 C22 29.5 22.5 26.5 25 25 C27.5 23.5 30 24.8 32 27 Z"
      fill="url(#accentGrad)"
    />

    <!-- Right Pillar of N -->
    <path
      d="M64 29 C64 26.2 66.2 24 69 24 C71.8 24 74 26.2 74 29 V70 C74 72.8 71.8 75 69 75 C66.2 75 64 72.8 64 70 V29 Z"
      fill="url(#nadhiliGrad)"
    />

    <!-- Center AI Spark Core / Diamond -->
    <path
      d="M50 38 L54 47 L63 50 L54 53 L50 62 L46 53 L37 50 L46 47 Z"
      fill="#ffffff"
      opacity="0.95"
    />

    <!-- Neural Circuit Nodes -->
    <circle cx="31" cy="27" r="3.5" fill="#ffd166" />
    <circle cx="69" cy="73" r="3.5" fill="#ffd166" />
    <circle cx="50" cy="50" r="2.5" fill="#ffffff" />
  </g>
</svg>

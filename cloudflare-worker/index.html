<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NADHILI AI - Cloudflare Workers Chat</title>
  <meta name="description" content="Production-ready AI chat platform powered by Cloudflare Workers, Cloudflare D1, and Groq llama-3.3-70b-versatile.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #0a0a0a; color: #ededed; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 9999px; }
    .prose-content { color: #d6d6d6; line-height: 1.7; font-size: 0.95rem; }
    .prose-content p { margin-bottom: 0.85em; }
    .prose-content p:last-child { margin-bottom: 0; }
    .prose-content h1, .prose-content h2, .prose-content h3 { color: #f5f5f5; font-weight: 600; margin-top: 1em; margin-bottom: 0.4em; }
    .prose-content ul { list-style: disc; margin-left: 1.4em; margin-bottom: 0.85em; }
    .prose-content ol { list-style: decimal; margin-left: 1.4em; margin-bottom: 0.85em; }
    .prose-content blockquote { border-left: 3px solid #f5a623; padding-left: 1rem; color: #9ca3af; margin: 0.85em 0; }
    .prose-content code:not(pre code) { background: rgba(245, 166, 35, 0.12); color: #f5a623; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; }
    .prose-content table { width: 100%; border-collapse: collapse; margin: 1em 0; }
    .prose-content th, .prose-content td { border: 1px solid #2a2a2a; padding: 0.5rem 0.75rem; text-align: left; }
    .prose-content th { background: #181818; }
    @keyframes dotPulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    .dot-1 { animation: dotPulse 1.4s infinite ease-in-out; }
    .dot-2 { animation: dotPulse 1.4s infinite ease-in-out 0.2s; }
    .dot-3 { animation: dotPulse 1.4s infinite ease-in-out 0.4s; }
  </style>
</head>
<body class="h-screen flex overflow-hidden bg-[#0a0a0a] text-[#ededed]">
  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-72 bg-[#111111] border-r border-[#222222] flex flex-col shrink-0 transition-transform duration-300 z-30 fixed md:static inset-y-0 -translate-x-full md:translate-x-0">
    <div class="p-4 border-b border-[#222222] flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#f5a623] to-[#ffb84d] flex items-center justify-center font-bold text-black text-sm shadow-[0_0_12px_rgba(245,166,35,0.4)]">
          N
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-wide flex items-center gap-1.5 text-white">
            NADHILI AI
            <span class="text-[10px] bg-[#f5a623]/20 text-[#f5a623] px-1.5 py-0.5 rounded font-mono font-medium">CF D1</span>
          </h1>
          <p class="text-[10px] text-neutral-400">by NADHILI DEVELOPER</p>
        </div>
      </div>
      <button onclick="toggleSidebar()" class="md:hidden text-neutral-400 hover:text-white p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="p-3 space-y-2">
      <button onclick="startNewChat()" class="w-full bg-[#1b1b1b] hover:bg-[#252525] border border-[#2b2b2b] hover:border-[#f5a623]/50 text-white rounded-lg px-3 py-2 text-xs font-medium flex items-center justify-between transition-colors shadow-sm">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-[#f5a623]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          New conversation
        </span>
        <kbd class="text-[10px] text-neutral-400 bg-[#121212] px-1.5 py-0.5 rounded border border-[#2b2b2b]">⌘K</kbd>
      </button>

      <div class="relative">
        <input type="text" id="searchInput" oninput="filterConversations()" placeholder="Search history..." class="w-full bg-[#161616] border border-[#242424] focus:border-[#f5a623] focus:outline-none rounded-md px-3 py-1.5 pl-8 text-xs text-neutral-200 placeholder-neutral-500">
        <svg class="w-3.5 h-3.5 text-neutral-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-2 space-y-1" id="conversationsList">
      <div id="loadingHistory" class="text-xs text-neutral-500 text-center py-4">Loading history...</div>
    </div>

    <div class="p-3 border-t border-[#222222] bg-[#0e0e0e]" id="authFooter"></div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main class="flex-1 flex flex-col h-full bg-[#0a0a0a] relative">
    <header class="h-14 border-b border-[#1c1c1c] flex items-center justify-between px-4 shrink-0 bg-[#0a0a0a]/90 backdrop-blur">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden text-neutral-400 hover:text-white p-1 rounded hover:bg-[#1a1a1a]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div class="relative">
          <button id="modelBtn" onclick="toggleModelDropdown()" class="flex items-center gap-2 bg-[#141414] hover:bg-[#1c1c1c] border border-[#262626] rounded-lg px-2.5 py-1.5 text-xs font-medium text-neutral-200 transition">
            <span class="w-2 h-2 rounded-full bg-[#f5a623] inline-block animate-pulse"></span>
            <span id="currentModelLabel">NADHILI Sonnet (Groq 70B)</span>
            <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="modelDropdown" class="hidden absolute top-full left-0 mt-1 w-64 bg-[#141414] border border-[#2a2a2a] rounded-lg shadow-2xl py-1 z-50 text-xs">
            <button onclick="selectModel('llama-3.3-70b-versatile', 'NADHILI Sonnet (Groq 70B)')" class="w-full text-left px-3 py-2 hover:bg-[#1f1f1f] flex flex-col">
              <span class="font-medium text-white flex items-center justify-between">NADHILI Sonnet <span class="text-[10px] text-[#f5a623] bg-[#f5a623]/10 px-1 rounded">Fastest</span></span>
              <span class="text-[10px] text-neutral-400">Groq llama-3.3-70b-versatile • Full reasoning</span>
            </button>
            <button onclick="selectModel('llama-3.2-11b-vision-preview', 'NADHILI Vision (Groq 11B)')" class="w-full text-left px-3 py-2 hover:bg-[#1f1f1f] flex flex-col border-t border-[#222]">
              <span class="font-medium text-white flex items-center justify-between">NADHILI Vision <span class="text-[10px] text-cyan-400 bg-cyan-400/10 px-1 rounded">Vision</span></span>
              <span class="text-[10px] text-neutral-400">Image understanding & code OCR</span>
            </button>
            <button onclick="selectModel('gemini-2.5-flash', 'NADHILI Opus (Ultra Flash)')" class="w-full text-left px-3 py-2 hover:bg-[#1f1f1f] flex flex-col border-t border-[#222]">
              <span class="font-medium text-white flex items-center justify-between">NADHILI Opus <span class="text-[10px] text-emerald-400 bg-emerald-400/10 px-1 rounded">2M Ctx</span></span>
              <span class="text-[10px] text-neutral-400">Deep technical & large codebases</span>
            </button>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openProModal()" class="text-xs bg-gradient-to-r from-[#f5a623]/20 to-[#f5a623]/10 hover:from-[#f5a623]/30 hover:to-[#f5a623]/20 text-[#f5a623] border border-[#f5a623]/40 px-2.5 py-1 rounded-md font-medium transition flex items-center gap-1.5 shadow-[0_0_10px_rgba(245,166,35,0.15)]">
          ★ Upgrade to Pro
        </button>
      </div>
    </header>

    <div id="chatScrollArea" class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
      <div id="welcomeScreen" class="max-w-2xl mx-auto my-auto text-center pt-8 pb-12">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#f5a623] to-[#ffc86b] text-black font-extrabold text-2xl flex items-center justify-center mx-auto mb-4 shadow-[0_0_24px_rgba(245,166,35,0.45)]">
          N
        </div>
        <h2 class="text-2xl font-bold text-white mb-2">What would you like to explore today?</h2>
        <p class="text-sm text-neutral-400 max-w-md mx-auto mb-8">
          Powered by Cloudflare Workers edge architecture, Cloudflare D1 persistence, and ultra-fast Groq LLaMA 3.3.
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
          <button onclick="usePrompt('Write a production-ready Cloudflare Worker with rate limiting and D1 caching')" class="p-3 bg-[#131313] hover:bg-[#1a1a1a] border border-[#222222] hover:border-[#f5a623]/50 rounded-xl transition text-xs group">
            <span class="text-white font-medium block mb-1 group-hover:text-[#f5a623]">⚡ Cloudflare Worker Architecture</span>
            <span class="text-neutral-400">Write an edge worker with rate limiting and D1 SQLite caching</span>
          </button>
          <button onclick="usePrompt('Explain how crypto.subtle HMAC-SHA256 JWT validation works in Cloudflare Workers')" class="p-3 bg-[#131313] hover:bg-[#1a1a1a] border border-[#222222] hover:border-[#f5a623]/50 rounded-xl transition text-xs group">
            <span class="text-white font-medium block mb-1 group-hover:text-[#f5a623]">🔒 Web Crypto JWT Auth</span>
            <span class="text-neutral-400">Explain HMAC-SHA256 signature verification at the edge</span>
          </button>
          <button onclick="usePrompt('Create a TypeScript algorithm to solve the Maximum Subarray problem with O(n) complexity')" class="p-3 bg-[#131313] hover:bg-[#1a1a1a] border border-[#222222] hover:border-[#f5a623]/50 rounded-xl transition text-xs group">
            <span class="text-white font-medium block mb-1 group-hover:text-[#f5a623]">💻 Code & Algorithmic Problem Solving</span>
            <span class="text-neutral-400">Kadane algorithm implementation with full edge test cases</span>
          </button>
          <button onclick="usePrompt('Draft a concise, compelling announcement email for our new AI product launch')" class="p-3 bg-[#131313] hover:bg-[#1a1a1a] border border-[#222222] hover:border-[#f5a623]/50 rounded-xl transition text-xs group">
            <span class="text-white font-medium block mb-1 group-hover:text-[#f5a623]">✍️ High-Impact Copywriting</span>
            <span class="text-neutral-400">Draft a launch letter that converts developers and leaders</span>
          </button>
        </div>
      </div>

      <div id="messagesList" class="max-w-3xl mx-auto space-y-6"></div>
    </div>

    <!-- Input Area -->
    <div class="p-4 pt-1 bg-[#0a0a0a] border-t border-[#1a1a1a] shrink-0">
      <div class="max-w-3xl mx-auto">
        <div id="imagePreviewContainer" class="hidden mb-2 flex items-center gap-2 p-2 bg-[#161616] border border-[#2b2b2b] rounded-lg w-max">
          <img id="imagePreview" src="" alt="preview" class="w-12 h-12 object-cover rounded">
          <div class="text-xs pr-2">
            <p id="imagePreviewName" class="text-neutral-200 font-medium truncate max-w-xs">image.png</p>
            <p class="text-[10px] text-neutral-400">Attached for Vision analysis</p>
          </div>
          <button onclick="removeAttachedImage()" class="text-neutral-400 hover:text-white p-1">✕</button>
        </div>

        <div class="bg-[#141414] border border-[#242424] focus-within:border-[#f5a623]/80 rounded-2xl p-2.5 transition shadow-lg">
          <textarea
            id="messageInput"
            rows="2"
            placeholder="Reply to NADHILI AI or paste code..."
            oninput="handleInputResize(this)"
            onkeydown="handleKeyDown(event)"
            class="w-full bg-transparent resize-none focus:outline-none text-sm text-[#ededed] placeholder-neutral-500 max-h-48 px-1.5 pt-1"
          ></textarea>

          <div class="flex items-center justify-between pt-2 border-t border-[#1f1f1f] px-1 text-xs">
            <div class="flex items-center gap-1.5 text-neutral-400">
              <input type="file" id="imageFileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
              <button onclick="document.getElementById('imageFileInput').click()" title="Attach image" class="p-1.5 hover:text-white hover:bg-[#202020] rounded-lg">📎</button>
              <button onclick="exportCurrentChat()" title="Export chat" class="p-1.5 hover:text-white hover:bg-[#202020] rounded-lg">💾</button>
            </div>

            <div class="flex items-center gap-3">
              <span id="charCount" class="text-[11px] text-neutral-500 font-mono">0 chars • ~0 tokens</span>
              <button id="sendBtn" onclick="sendMessage()" class="w-8 h-8 rounded-xl bg-[#f5a623] hover:bg-[#ffb33e] text-black font-bold flex items-center justify-center transition">
                ➤
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentToken = localStorage.getItem('nadhili_token') || null;
    let currentUser = null;
    let conversations = [];
    let currentConversationId = null;
    let currentMessages = [];
    let currentModel = 'llama-3.3-70b-versatile';
    let attachedImageBase64 = null;
    let isGenerating = false;
    let abortController = null;

    window.addEventListener('DOMContentLoaded', async () => {
      marked.setOptions({ breaks: true });
      await checkAuth();
      await loadConversations();
    });

    async function checkAuth() {
      if (!currentToken) { renderAuthFooter(null); return; }
      try {
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + currentToken } });
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
          renderAuthFooter(currentUser);
        }
      } catch (e) { renderAuthFooter(null); }
    }

    function renderAuthFooter(user) {
      const footer = document.getElementById('authFooter');
      if (user) {
        footer.innerHTML = '<div class="flex items-center justify-between text-xs text-white"><span>' + escapeHtml(user.name) + '</span><button onclick="logout()" class="text-neutral-400 hover:text-white">Exit</button></div>';
      } else {
        footer.innerHTML = '<div class="text-xs text-neutral-400"><p>Guest Mode</p></div>';
      }
    }

    function logout() {
      currentToken = null;
      currentUser = null;
      localStorage.removeItem('nadhili_token');
      renderAuthFooter(null);
      startNewChat();
    }

    async function loadConversations() {
      if (!currentToken) { document.getElementById('loadingHistory').innerText = 'Guest mode active'; return; }
      try {
        const res = await fetch('/api/conversations', { headers: { 'Authorization': 'Bearer ' + currentToken } });
        if (res.ok) {
          conversations = await res.json();
          renderConversationsList();
        }
      } catch (e) {}
    }

    function renderConversationsList() {
      const container = document.getElementById('conversationsList');
      if (!conversations.length) {
        container.innerHTML = '<div class="text-xs text-neutral-500 text-center py-4">No conversations yet</div>';
        return;
      }
      container.innerHTML = conversations.map(c => 
        '<div class="px-2.5 py-2 rounded text-xs cursor-pointer text-neutral-300 hover:bg-[#1a1a1a]" onclick="loadConversation(\'' + c.id + '\')">' + escapeHtml(c.title) + '</div>'
      ).join('');
    }

    async function loadConversation(id) {
      currentConversationId = id;
      try {
        const res = await fetch('/api/conversations/' + id, { headers: { 'Authorization': 'Bearer ' + currentToken } });
        if (res.ok) {
          const data = await res.json();
          currentMessages = data.messages || [];
          renderMessages();
        }
      } catch (e) {}
    }

    function startNewChat() {
      currentConversationId = null;
      currentMessages = [];
      renderMessages();
      document.getElementById('welcomeScreen').classList.remove('hidden');
    }

    function renderMessages() {
      const container = document.getElementById('messagesList');
      if (!currentMessages.length) {
        container.innerHTML = '';
        document.getElementById('welcomeScreen').classList.remove('hidden');
        return;
      }
      document.getElementById('welcomeScreen').classList.add('hidden');
      container.innerHTML = currentMessages.map(msg => {
        if (msg.role === 'user') {
          return '<div class="flex justify-end"><div class="bg-[#1c1c1c] text-white p-3 rounded-xl max-w-[85%] text-sm">' + escapeHtml(msg.content) + '</div></div>';
        } else {
          return '<div class="flex gap-3"><div class="w-7 h-7 rounded-full bg-[#f5a623] text-black font-bold text-xs flex items-center justify-center shrink-0">N</div><div class="prose-content flex-1 max-w-[90%] text-sm">' + marked.parse(msg.content) + '</div></div>';
        }
      }).join('');
      const scroll = document.getElementById('chatScrollArea');
      scroll.scrollTop = scroll.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text && !attachedImageBase64) return;
      if (isGenerating) return;

      currentMessages.push({ role: 'user', content: text, image: attachedImageBase64 });
      input.value = '';
      currentMessages.push({ role: 'assistant', content: '' });
      renderMessages();

      isGenerating = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(currentToken ? { 'Authorization': 'Bearer ' + currentToken } : {})
          },
          body: JSON.stringify({
            conversationId: currentConversationId,
            message: text,
            messages: currentMessages.slice(0, -1),
            model: currentModel,
            imageBase64: attachedImageBase64
          })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let full = '';
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') break;
              try {
                const parsed = JSON.parse(data);
                if (parsed.text) {
                  full += parsed.text;
                  currentMessages[currentMessages.length - 1].content = full;
                  renderMessages();
                }
                if (parsed.conversationId && !currentConversationId) {
                  currentConversationId = parsed.conversationId;
                }
              } catch (e) {}
            }
          }
        }
      } catch (err) {
      } finally {
        isGenerating = false;
      }
    }

    function usePrompt(t) {
      document.getElementById('messageInput').value = t;
      sendMessage();
    }

    function handleInputResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 180) + 'px';
      const len = el.value.length;
      document.getElementById('charCount').innerText = len + ' chars • ~' + Math.ceil(len / 4) + ' tokens';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
